version: "3.3"

services:
  mysqldb:
    container_name: mysqldb
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devopsdb        
    volumes:
      - /home/mysql/data:/var/lib/mysql
    ports:
      - "3306:3306"                   
    networks:
      - spring-network                

  spring_app:
    build: .
    container_name: devopscontainer
    restart: on-failure
    ports:
      - "9096:9096"
    depends_on:
      - mysqldb
    networks:
      - spring-network                
networks:
  spring-network:
