version: "3.9"

services:
  my-app:
    image: mohamedaminelili02/my-app:latest
    container_name: my-app
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - my-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
