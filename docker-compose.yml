services:
  mysqldb:
    container_name: mysqldb
    image: mysql:9.4.0
    restart: unless-stopped
    networks:
      - app-network
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tpFoyer17
    volumes:
      - mysql_data:/var/lib/mysql

  spring_app:
    image: seifkaroui/gl5-g2-foyer:latest
    container_name: spring
    restart: on-failure
    networks:
      - app-network
    ports:
      - 8082:8082
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/tpFoyer17?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    depends_on:
      - mysqldb

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
