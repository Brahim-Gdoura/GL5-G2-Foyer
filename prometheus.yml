global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'foyer-app'
    metrics_path: '/tpFoyer17/actuator/prometheus'
    static_configs:
      - targets: ['foyer:8080']
    scrape_interval: 10s
