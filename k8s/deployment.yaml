apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer
  template:
    metadata:
      labels:
        app: tpfoyer
    spec:
      containers:
        - name: tpfoyer
          image: 261321787194.dkr.ecr.us-east-1.amazonaws.com/tpfoyer-app:latest
          ports:
            - containerPort: 8080
