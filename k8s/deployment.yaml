apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpfoyer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpfoyer
  template:
    metadata:
      labels:
        app: tpfoyer
    spec:
      containers:
        - name: tpfoyer
          image: IMAGE_TO_REPLACE
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tpfoyer-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: tpfoyer
