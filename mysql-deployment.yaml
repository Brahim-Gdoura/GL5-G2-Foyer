apiVersion: v1
kind: Namespace
metadata:
  name: tpfoyer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: tpfoyer
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS tpfoyer;
    USE tpfoyer;
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: tpfoyer
type: Opaque
data:
  password: cm9vdA==  # "root" base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: tpfoyer
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: MYSQL_DATABASE
              value: "tpfoyer"
          volumeMounts:
            - name: mysql-initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: mysql-initdb
          configMap:
            name: mysql-config
        - name: mysql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: tpfoyer
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP