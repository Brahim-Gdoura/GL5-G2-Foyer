apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: mohamedaminelili02/my-app:latest
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: demo
spec:
  type: NodePort
  selector:
    app: my-app
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
