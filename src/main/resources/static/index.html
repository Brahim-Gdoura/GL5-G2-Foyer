<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universite Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
        input, button { margin: 5px; }
    </style>
</head>
<body>
<h1>Universite Management</h1>

<h2>Add Universite</h2>
<input id="nom" placeholder="Nom Universite">
<input id="adresse" placeholder="Adresse">
<button onclick="addUniversite()">Add</button>

<h2>Universites</h2>
<div id="universites"></div>

<script>
    const baseUrl = '/tpFoyer17/api/univeristes';

    async function fetchUniversites() {
        const res = await fetch(`${baseUrl}/getAll`);
        const data = await res.json();
        const container = document.getElementById('universites');
        container.innerHTML = '';
        data.forEach(u => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                    <strong>ID:</strong> ${u.idUniversite}<br>
                    <strong>Nom:</strong> ${u.nomUniversite}<br>
                    <strong>Adresse:</strong> ${u.adresse}
                `;
            container.appendChild(div);
        });
    }

    async function addUniversite() {
        const nom = document.getElementById('nom').value;
        const adresse = document.getElementById('adresse').value;

        if (!nom || !adresse) return alert('Please fill all fields');

        const res = await fetch(`${baseUrl}/add`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nomUniversite: nom, adresse: adresse })
        });

        if (res.ok) {
            alert('Universite added');
            document.getElementById('nom').value = '';
            document.getElementById('adresse').value = '';
            fetchUniversites();
        } else {
            alert('Failed to add Universite');
        }
    }

    // Load initial data
    fetchUniversites();
</script>
</body>
</html>
