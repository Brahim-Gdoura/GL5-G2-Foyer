# Server configuration
server.servlet.context-path=/tpFoyer17
server.port=8082

### DATABASE ###
spring.datasource.url=jdbc:postgresql://localhost:5432/tpFoyer17
spring.datasource.username=admin   # replace with your Postgres username
spring.datasource.password=admin      # replace with your Postgres password
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
