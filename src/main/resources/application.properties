# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.servlet.context-path=/tpFoyer17
server.port=8080

# Application name (visible dans Prometheus)
spring.application.name=foyer-app

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/tpFoyer17?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# ACTUATOR CONFIGURATION (Monitoring)
# ==========================================

# Expose tous les endpoints Actuator
management.endpoints.web.exposure.include=*

# Ou exposer seulement les endpoints nécessaires
# management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Désactiver les endpoints sensibles si nécessaire
# management.endpoints.web.exposure.exclude=shutdown,threaddump

# Base path pour les endpoints Actuator
management.endpoints.web.base-path=/actuator

# Port pour Actuator (même port que l'application par défaut)
# management.server.port=8080

# Health endpoint - montrer tous les détails
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Activer l'endpoint Prometheus
management.endpoint.prometheus.enabled=true

# Activer l'endpoint metrics
management.endpoint.metrics.enabled=true

# ==========================================
# PROMETHEUS METRICS CONFIGURATION
# ==========================================

# Activer l'export des métriques vers Prometheus
management.metrics.export.prometheus.enabled=true

# Ajouter des tags communs à toutes les métriques
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production

# Activer les métriques JVM
management.metrics.enable.jvm=true

# Activer les métriques du système
management.metrics.enable.system=true

# Activer les métriques HTTP
management.metrics.enable.http=true

# Activer les métriques de la base de données
management.metrics.enable.jdbc=true

# Distribution des métriques HTTP
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==========================================
# INFO ENDPOINT (visible dans /actuator/info)
# ==========================================
info.app.name=Foyer Application
info.app.description=Application de gestion de foyer avec monitoring Prometheus
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=tn.esprit.tpfoyer17.controllers
springdoc.paths-to-match=/**

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.root=INFO
logging.level.tn.esprit.tpfoyer17=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Pattern de log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n